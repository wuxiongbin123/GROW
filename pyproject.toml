[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grow-vla"
version = "0.1.0"
description = "GROW evaluation code for OpenHA Minecraft rollouts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "TODO"}
authors = [
    {name = "GROW Authors"}
]
dependencies = [
    "accelerate==1.2.1",
    "av==14.1.0",
    "huggingface-hub==0.28.1",
    "minestudio",
    "numpy==1.26.4",
    "opencv-python",
    "opencv-python-headless",
    "pillow==10.4.0",
    "ray",
    "rich",
    "sentencepiece==0.2.0",
    "tokenizers==0.21.0",
    "torch",
    "torchaudio",
    "torchvision",
    "tqdm",
    "transformers",
    "vllm==0.8.2",
]

[project.urls]
Weights = "https://huggingface.co/sys555/GROW"
OpenHA = "https://github.com/CraftJarvis/OpenHA"
JarvisVLA = "https://github.com/CraftJarvis/JarvisVLA"

[tool.setuptools.packages.find]
include = ["jarvisvla*"]

[tool.setuptools.package-data]
jarvisvla = ["assets/*.json", "evaluate/assets/*.json"]
